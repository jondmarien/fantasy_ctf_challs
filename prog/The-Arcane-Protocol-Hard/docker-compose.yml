services:
  arcane-protocol:
    build: .
    ports:
    - 1337:1337
    environment:
    - FLAG=FantasyCTF{k3ys_4nd_3ch03s_uns34l_th3_d00r}
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    networks:
    - challenge_net
networks:
  challenge_net: {}
