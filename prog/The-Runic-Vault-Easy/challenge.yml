name: "The Runic Vault"
author: "Jon Marien"
category: prog
description: |
  Deep beneath the Runekeeper's Tower lies a vault sealed by an ancient four-letter word of power. The vault keeper encrypted its contents with a repeating-key XOR cipher using this word — four lowercase letters, no more, no less.

  Break the seal and claim what lies within.
value: 150
type: dynamic
extra:
  initial: 150
  minimum: 30
  decay: 30
  function: aachen
solution: solution/SOLUTION.md

flags:
  - type: static
    content: "FantasyCTF{run3s_x0r_th3_v4ult_0p3n}"
    case_sensitive: false
files:
  - challenge/vault_locked.bin
  - challenge/encrypt.py
hints:
  - content: "The vault's key is a real word, but you don't need to know which one — just try them all."
    cost: 15
  - content: "XOR the ciphertext against every 4-letter lowercase combo. Check for a known flag prefix."
    cost: 35
requirements:
  prerequisites:
    - "The Guild Ledger"
  anonymize: preview
next: "The Dungeon Cartographer"
tags:
  - xor
  - brute-force
  - easy
topics:
  - xor-cipher
  - brute-force
  - key-recovery
state: visible
version: "0.1"
