services:
  prog-advanced:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - 1341:1338
    environment:
    - FLAG_CHRONOMANCER=FantasyCTF{t1m3_b3nds_t0_th3_sw1ft_m1nd}
    - FLAG_ARCHITECT=FantasyCTF{th3_4byss_y13lds_t0_1ts_4rch1t3ct}
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    networks:
    - challenge_net
networks:
  challenge_net: {}
