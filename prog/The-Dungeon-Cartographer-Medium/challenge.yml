name: "The Dungeon Cartographer"
author: "Jon Marien"
category: prog
description: |
  A dungeon map was recovered from the pack of a fallen adventurer. Each chamber has a toll — the cost in gold to pass through. The treasure door only opens when fed the exact minimum cost to traverse from entrance to exit.

  Find the cheapest path through the dungeon.
value: 200
type: dynamic
extra:
  initial: 200
  minimum: 30
  decay: 20
flags:
  - type: static
    content: "FantasyCTF{1638}"
    case_sensitive: false
files:
  - challenge/dungeon.txt
  - challenge/challenge.py
hints:
  - content: "The dungeon respects efficiency. Find the cheapest route."
    cost: 20
  - content: "Model the grid as a graph. Each cell is a node; weights are the cell values. Use Dijkstra."
    cost: 40
  - content: "Use Python's heapq with Dijkstra's algorithm from (0,0) to (N-1,N-1)."
    cost: 60
requirements:
  - "The Runic Vault"
  - "The Cartographer's Lost Map"
next: "The Arcane Protocol"
tags:
  - algorithms
  - medium
topics:
  - dijkstra
  - graph-theory
  - shortest-path
state: hidden
version: "0.1"
