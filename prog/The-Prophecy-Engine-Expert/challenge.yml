name: The Prophecy Engine
author: ISSessions
category: prog
description: |-
  The Prophecy Engine transforms what you give it, step by step, in ways both ancient and recursive. Connect to it, probe it with the ORACLE command, deduce the multi-stage transformation, then use the CHALLENGE command to receive a target output and compute the input that produces it.
value: 1000
type: dynamic

extra:
  initial: 1000
  minimum: 30
  decay: 30

image: .
protocol: tcp
connection_info: nc 0.cloud.chals.io 26408

flags:
- type: static
  content: FantasyCTF{r3v3rs3_th3_pr0ph3cy_3ng1n3}
  case_sensitive: false

files:
- challenge/prophecy_engine.py

hints:
- content: Send simple inputs first. 0, 1, 2. Watch what comes back.
  cost: 75
- content: >-
    The engine applies transformations left to right. Reverse each step from right
    to left.
  cost: 100
- content: Each stage is independently reversible. Isolate them one at a time.
  cost: 125

requirements:
- The Arcane Protocol

state: hidden

version: '0.1'
