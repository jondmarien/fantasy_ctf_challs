services:
  prophecy-engine:
    build: .
    ports:
    - 1339:1337
    environment:
    - FLAG=FantasyCTF{r3v3rs3_th3_pr0ph3cy_3ng1n3}
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    networks:
    - challenge_net
networks:
  challenge_net: {}
