services:
  enchanted-parrot:
    build:
      context: .
      dockerfile: The-Enchanted-Parrot-Beginner/Dockerfile
    ports:
      - "7001:8000"
    env_file: .env
    environment:
      - FLAG=FantasyCTF{p0lly_w4nts_4_s3cr3t}
      - GEMINI_MODEL=gemini-2.5-flash
      - RATE_LIMIT=30
    restart: unless-stopped

