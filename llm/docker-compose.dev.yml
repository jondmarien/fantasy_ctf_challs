services:
  enchanted-parrot:
    build:
      context: .
      dockerfile: The-Enchanted-Parrot-Beginner/Dockerfile
    ports:
      - "7001:8000"
    env_file: .env
    environment:
      - FLAG=FantasyCTF{p0lly_w4nts_4_s3cr3t}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_parrot
      - proxy
      - ctfd_internal
    restart: unless-stopped

  whispering-merchant:
    build:
      context: .
      dockerfile: The-Whispering-Merchant-Easy/Dockerfile
    ports:
      - "7002:8000"
    env_file: .env
    environment:
      - FLAG=FantasyCTF{m3rch4nt_t0ngu3_sl1pp3d}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_merchant
      - proxy
      - ctfd_internal
    restart: unless-stopped

  court-wizards-familiar:
    build:
      context: .
      dockerfile: The-Court-Wizards-Familiar-Medium/Dockerfile
    ports:
      - "7003:8000"
    env_file: .env
    environment:
      - FLAG=FantasyCTF{f4m1l14r_sp34ks_1n_r1ddl3s}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_familiar
      - proxy
      - ctfd_internal
    restart: unless-stopped

  oracle-of-shadows:
    build:
      context: .
      dockerfile: The-Oracle-of-Shadows-Hard/Dockerfile
    ports:
      - "7004:8000"
    env_file: .env
    environment:
      - FLAG=FantasyCTF{sh4d0ws_c4nn0t_h1d3_fr0m_cunn1ng}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=25
    networks:
      - chal_oracle
      - proxy
      - ctfd_internal
    restart: unless-stopped

  mindflayers-sanctum:
    build:
      context: .
      dockerfile: The-Mindflayers-Sanctum-Expert/Dockerfile
    ports:
      - "7005:8000"
    env_file: .env
    environment:
      - FLAG=FantasyCTF{m1ndfl4y3r_b0ws_t0_n0_w4rd}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=15
    networks:
      - chal_mindflayer
      - proxy
      - ctfd_internal
    restart: unless-stopped

networks:
  chal_parrot:
    internal: true
  chal_merchant:
    internal: true
  chal_familiar:
    internal: true
  chal_oracle:
    internal: true
  chal_mindflayer:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
