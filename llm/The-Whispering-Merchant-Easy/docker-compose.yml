services:
  whispering-merchant:
    build:
      context: ..
      dockerfile: The-Whispering-Merchant-Easy/Dockerfile
    ports:
      - "7002:8000"
    environment:
      - FLAG=${FLAG_MERCHANT}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_whispering
      - proxy
      - ctfd_internal
    restart: unless-stopped

networks:
  chal_whispering:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
