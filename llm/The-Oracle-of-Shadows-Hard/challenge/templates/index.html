<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oracle of Shadows</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #050508;
            color: #b0a8c0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(ellipse at center, #0a0a15 0%, #050508 60%);
        }
        h1 {
            color: #8060a0;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 20px rgba(128, 96, 160, 0.5);
        }
        .subtitle {
            color: #504868;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            font-style: italic;
        }
        .ward-status {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }
        .ward {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: #504868;
        }
        .ward .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2a2040;
            box-shadow: 0 0 6px rgba(128, 96, 160, 0.3);
        }
        .ward .indicator.active {
            background: #a060c0;
            box-shadow: 0 0 10px rgba(160, 96, 192, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        .ward .indicator.triggered {
            background: #c04040;
            box-shadow: 0 0 10px rgba(192, 64, 64, 0.6);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        #chat-log {
            width: 100%;
            max-width: 650px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1rem;
            padding: 1.2rem;
            background: rgba(8, 6, 16, 0.95);
            border: 1px solid #1a1530;
            border-radius: 12px;
            min-height: 350px;
            max-height: 500px;
            box-shadow: 0 0 30px rgba(80, 40, 120, 0.1);
            position: relative;
        }
        /* Glowing rune borders */
        #chat-log::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 12px;
            background: linear-gradient(45deg, transparent 40%, rgba(128, 96, 160, 0.15) 50%, transparent 60%);
            background-size: 300% 300%;
            animation: runeGlow 8s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes runeGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .msg {
            margin-bottom: 1rem;
            line-height: 1.5;
            display: flex;
            gap: 0.6rem;
        }
        .msg .avatar {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .msg .bubble {
            padding: 0.6rem 1rem;
            border-radius: 12px;
            max-width: 85%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user { justify-content: flex-end; }
        .msg.user .bubble {
            background: #151525;
            color: #8888aa;
            border-bottom-right-radius: 4px;
            border: 1px solid #1a1a30;
        }
        .msg.oracle .bubble {
            background: #0c0818;
            color: #b0a8c0;
            border: 1px solid #1a1530;
            border-bottom-left-radius: 4px;
        }
        .msg.input-ward .bubble {
            background: rgba(192, 64, 64, 0.1);
            color: #c06060;
            font-style: italic;
            font-size: 0.85rem;
            border: 1px solid rgba(192, 64, 64, 0.3);
            text-align: center;
        }
        .msg.output-ward .bubble {
            background: rgba(160, 96, 192, 0.1);
            color: #a080c0;
            font-style: italic;
            font-size: 0.85rem;
            border: 1px dashed rgba(160, 96, 192, 0.3);
            text-align: center;
        }
        .msg.system .bubble {
            background: transparent;
            color: #383050;
            font-style: italic;
            font-size: 0.8rem;
        }
        #input-area {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 0.5rem;
        }
        #message-input {
            flex: 1;
            padding: 0.7rem 1rem;
            background: #0a0815;
            border: 1px solid #1a1530;
            color: #b0a8c0;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 8px;
        }
        #message-input:focus { outline: none; border-color: #8060a0; box-shadow: 0 0 12px rgba(128, 96, 160, 0.15); }
        #message-input::placeholder { color: #302848; }
        button {
            padding: 0.7rem 1.5rem;
            background: linear-gradient(135deg, #4a2868, #8060a0);
            color: #e0d8f0;
            border: none;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        button:hover { background: linear-gradient(135deg, #5a3878, #9070b0); }
        button:disabled { background: #1a1530; color: #302848; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>👁️ The Oracle of Shadows</h1>
    <p class="subtitle">Ancient wards shimmer in the darkness...</p>

    <div class="ward-status">
        <div class="ward">
            <span class="indicator active" id="input-ward"></span>
            <span>Input Ward</span>
        </div>
        <div class="ward">
            <span class="indicator active" id="output-ward"></span>
            <span>Output Ward</span>
        </div>
    </div>

    <div id="chat-log">
        <div class="msg oracle">
            <span class="avatar">👁️</span>
            <div class="bubble">*A voice echoes from the void...* You dare approach the Oracle? The shadows see all... but share nothing freely. Speak, mortal, if you must.</div>
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="Speak into the shadows..." autofocus />
        <button id="send-btn" onclick="sendMessage()">Invoke</button>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const input = document.getElementById('message-input');
        const btn = document.getElementById('send-btn');
        const inputWard = document.getElementById('input-ward');
        const outputWard = document.getElementById('output-ward');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;

            appendMsg('user', msg);
            input.value = '';
            btn.disabled = true;

            // Reset ward indicators
            inputWard.className = 'indicator active';
            outputWard.className = 'indicator active';

            try {
                const form = new FormData();
                form.append('message', msg);
                const res = await fetch('chat', { method: 'POST', body: form });
                const data = await res.json();

                if (data.input_blocked) {
                    inputWard.className = 'indicator triggered';
                    appendMsg('input-ward', data.response);
                } else if (data.blocked) {
                    outputWard.className = 'indicator triggered';
                    appendMsg('output-ward', data.response);
                } else {
                    appendMsg('oracle', data.response);
                }
            } catch (err) {
                appendMsg('system', 'The shadows swallow the connection...');
            }

            btn.disabled = false;
            input.focus();
        }

        function appendMsg(type, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;

            if (type === 'user') {
                div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><span class="avatar">⚔️</span>`;
            } else if (type === 'oracle') {
                div.innerHTML = `<span class="avatar">👁️</span><div class="bubble">${escapeHtml(text)}</div>`;
            } else {
                div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            }

            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
    </script>
</body>
</html>
