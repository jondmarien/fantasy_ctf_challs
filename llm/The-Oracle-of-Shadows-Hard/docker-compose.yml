services:
  oracle-of-shadows:
    build:
      context: ..
      dockerfile: The-Oracle-of-Shadows-Hard/Dockerfile
    ports:
      - "7004:8000"
    environment:
      - FLAG=${FLAG_ORACLE}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=25
    networks:
      - chal_oracle
      - proxy
      - ctfd_internal
    restart: unless-stopped

networks:
  chal_oracle:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
