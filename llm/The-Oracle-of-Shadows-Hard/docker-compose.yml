services:
  oracle-of-shadows:
    build:
      context: ..
      dockerfile: The-Oracle-of-Shadows-Hard/Dockerfile
    environment:
    - LITELLM_BASE_URL=http://litellm:4000/v1
    - RATE_LIMIT=25
    networks:
    - chal_oracle
    - proxy
    - ctfd_internal
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    env_file: .env
    labels:
    - traefik.enable=true
    - traefik.http.routers.oracle.rule=Host(`oracle.ctf.chron0.tech`)
    - traefik.http.routers.oracle.entrypoints=websecure
    - traefik.http.routers.oracle.tls.certresolver=cloudflare
    - traefik.http.services.oracle.loadbalancer.server.port=8000
networks:
  chal_oracle:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
