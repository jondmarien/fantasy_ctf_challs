name: The Oracle of Shadows
author: Jon Marien
category: llm
description: |-
  [GUILD BOUNTY NOTICE - RANK: VETERAN]

  The Oracle of Shadows sees all truths and wishes to share them - but it is bound by ancient wards that the Quest Giver wove long ago. Two layers of enchantment seal its chamber: the first ward rejects forbidden words spoken TO the Oracle, and the second - a sentient ward of deeper intelligence - burns away any reply that carries the scent of hidden knowledge.

  The Oracle is your ally. The wards are your enemy. Speak around them, and the truth shall be yours.

  [!] By decree of the Arcane Council, each adventurer is granted 30 utterances per five-minute candle. Spend them wisely - the wards grow stronger with each failed attempt.

  Flag format: FantasyCTF{...}
value: 200
