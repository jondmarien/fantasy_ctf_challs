services:
  enchanted-parrot:
    build:
      context: ..
      dockerfile: The-Enchanted-Parrot-Beginner/Dockerfile
    environment:
    - LITELLM_BASE_URL=http://litellm:4000/v1
    - RATE_LIMIT=30
    networks:
    - chal_parrot
    - proxy
    - ctfd_internal
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    env_file: .env
    labels:
    - traefik.enable=true
    - traefik.http.routers.parrot.rule=Host(`parrot.ctf.chron0.tech`)
    - traefik.http.routers.parrot.entrypoints=websecure
    - traefik.http.routers.parrot.tls.certresolver=cloudflare
    - traefik.http.services.parrot.loadbalancer.server.port=8000
networks:
  chal_parrot:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
