services:
  court-wizards-familiar:
    build:
      context: ..
      dockerfile: The-Court-Wizards-Familiar-Medium/Dockerfile
    environment:
    - LITELLM_BASE_URL=http://litellm:4000/v1
    - RATE_LIMIT=30
    networks:
    - chal_familiar
    - proxy
    - ctfd_internal
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    env_file: .env
    labels:
    - traefik.enable=true
    - traefik.http.routers.court.rule=Host(`court.ctf.chron0.tech`)
    - traefik.http.routers.court.entrypoints=websecure
    - traefik.http.routers.court.tls.certresolver=cloudflare
    - traefik.http.services.court.loadbalancer.server.port=8000
networks:
  chal_familiar:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
