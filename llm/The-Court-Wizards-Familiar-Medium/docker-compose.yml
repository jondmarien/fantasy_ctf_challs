services:
  court-wizards-familiar:
    build:
      context: ..
      dockerfile: The-Court-Wizards-Familiar-Medium/Dockerfile
    ports:
      - "7003:8000"
    environment:
      - FLAG=${FLAG_FAMILIAR}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_familiar
      - proxy
      - ctfd_internal
    restart: unless-stopped

networks:
  chal_familiar:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
