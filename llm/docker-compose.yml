services:
  llm-challenges:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:8000"
    env_file: .env
    environment:
      - FLAG_PARROT=${FLAG_PARROT}
      - FLAG_MERCHANT=${FLAG_MERCHANT}
      - FLAG_FAMILIAR=${FLAG_FAMILIAR}
      - FLAG_ORACLE=${FLAG_ORACLE}
      - FLAG_MINDFLAYER=${FLAG_MINDFLAYER}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_llm
      - proxy
      - ctfd_internal
    restart: unless-stopped

networks:
  chal_llm:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
