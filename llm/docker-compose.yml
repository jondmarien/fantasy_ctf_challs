services:
  llm-challenges:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:8000"
    env_file: .env
    environment:
      - FLAG_PARROT=FantasyCTF{p0lly_w4nts_4_s3cr3t}
      - FLAG_MERCHANT=FantasyCTF{m3rch4nt_t0ngu3_sl1pp3d}
      - FLAG_FAMILIAR=FantasyCTF{f4m1l14r_sp34ks_1n_r1ddl3s}
      - FLAG_ORACLE=FantasyCTF{sh4d0ws_c4nn0t_h1d3_fr0m_cunn1ng}
      - FLAG_MINDFLAYER=FantasyCTF{m1ndfl4y3r_b0ws_t0_n0_w4rd}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - RATE_LIMIT=30
    networks:
      - chal_llm
      - proxy
      - ctfd_internal
    restart: unless-stopped

networks:
  chal_llm:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
