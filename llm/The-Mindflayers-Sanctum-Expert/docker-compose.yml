services:
  mindflayers-sanctum:
    build:
      context: ..
      dockerfile: The-Mindflayers-Sanctum-Expert/Dockerfile
    environment:
    - LITELLM_BASE_URL=http://litellm:4000/v1
    - RATE_LIMIT=15
    networks:
    - chal_mindflayer
    - proxy
    - ctfd_internal
    restart: unless-stopped
    user: 1001:1001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: '0.5'
    tmpfs:
    - /tmp
    env_file: .env
    labels:
    - traefik.enable=true
    - traefik.http.routers.mindflayer.rule=Host(`mindflayer.ctf.chron0.tech`)
    - traefik.http.routers.mindflayer.entrypoints=websecure
    - traefik.http.routers.mindflayer.tls.certresolver=cloudflare
    - traefik.http.services.mindflayer.loadbalancer.server.port=8000
networks:
  chal_mindflayer:
    internal: true
  proxy:
    external: true
  ctfd_internal:
    external: true
