name: "The Dragon's Sealed Proclamation"
author: "Jon Marien"
category: crypto
description: |
  The Dragon-King sealed his royal proclamation with an RSA cipher, trusting his court wizard to generate secure keys. But the wizard, in his laziness, used a deterministic and predictable method to choose his primes.

  The public parameters and ciphertext are provided. Break the seal.
value: 200
type: dynamic
extra:
  initial: 200
  minimum: 30
  decay: 30
solution: solution/SOLUTION.md

flags:
  - type: static
    content: "FantasyCTF{sm4ll_pr1m3s_cr4ck_th3_s3al}"
    case_sensitive: false
files:
  - challenge/params.txt
  - challenge/encrypt.py
hints:
  - content: "The wizard didn't use random primes. He used a formula. Read the encryption script carefully."
    cost: 25
  - content: "The primes are deterministic. If you run the same keygen code, you get the same primes every time."
    cost: 50
requirements:
  prerequisites:
    - "The Goblin Messenger's Cipher"
  anonymize: preview
next: "The Lich's Cursed Oracle"
tags:
  - rsa
  - medium
topics:
  - weak-primes
  - factorization
  - rsa
state: visible
version: "0.1"
