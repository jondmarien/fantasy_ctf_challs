name: "The Goblin Messenger's Cipher"
author: "Jon Marien"
category: crypto
description: |
  A goblin courier was captured carrying an encrypted message between enemy camps. The goblins are known to use a simple keyword cipher — and rumour has it the key is the name of their warlord.

  Decrypt the message to uncover their plans.

  **Hint:** The cipher shifts each letter by the corresponding letter of a repeating keyword.
value: 150
type: dynamic
extra:
  initial: 150
  minimum: 30
  decay: 20
flags:
  - type: static
    content: "FantasyCTF{g0bl1n_sp1es_f4ll_t0_k4rzul}"
    case_sensitive: false
files:
  - challenge/ciphertext.txt
  - challenge/encrypt.py
hints:
  - content: "The goblins use a polyalphabetic substitution cipher — each letter of the key shifts the corresponding plaintext letter."
    cost: 15
  - content: "The key is a name. It's written right there in the intercepted file."
    cost: 35
requirements:
  - "The Scribe's Encoded Scroll"
next: "The Dragon's Sealed Proclamation"
tags:
  - classical-crypto
  - easy
topics:
  - vigenere
  - polyalphabetic-substitution
state: hidden
version: "0.1"
