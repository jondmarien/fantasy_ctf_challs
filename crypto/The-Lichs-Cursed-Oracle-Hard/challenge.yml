name: The Lich's Cursed Oracle
author: Jon Marien
category: crypto
description: |-
  The Lich guards his vault with an enchanted oracle that issues access tokens. You have been issued a guest token — but the vault only opens for admins.

  The oracle uses AES-CBC encryption. Study the token format and find a way to forge admin access without knowing the key.
value: 225
type: dynamic

extra:
  initial: 225
  minimum: 30
  decay: 30

image: .
protocol: tcp
connection_info: nc lich.ctf.chron0.tech 1337

flags:
- type: static
  content: FantasyCTF{bl0ck_by_bl0ck_th3_ch41n_br34ks}
  case_sensitive: false

files:
- challenge/oracle.py
- challenge/challenge.txt

hints:
- content: You can modify the IV to flip specific bits in the first decrypted block.
  cost: 35
- content: >-
    XOR the IV bytes at the right positions to change 'guest' to 'admin' in the decrypted
    token.
  cost: 75

requirements:
- The Dragon's Sealed Proclamation

next: "The Void Oracle's Lattice"
tags:
- aes
- network
- hard
topics:
