name: "The Void Oracle's Lattice"
author: "ISSessions"
category: crypto
description: |
  Beyond the veil of the material plane, the Void Oracle communicates across dimensions using an ancient RSA key exchange. To reduce latency, the Oracle chose a private exponent that is far too small.

  Intercept the Oracle's sealed message and recover its contents.

  **Hint:** When d is small relative to n, the continued fraction expansion of e/n reveals it.
value: 1000
type: dynamic
extra:
  initial: 1000
  minimum: 30
  decay: 30
flags:
  - type: static
    content: "FantasyCTF{w13n3rs_4tt4ck_br34ks_th3_v01d}"
    case_sensitive: false
files:
  - challenge/params.txt
  - challenge/encrypt.py
hints:
  - content: "What attack exploits a private exponent that is *too small*?"
    cost: 75
  - content: "Wiener's attack uses continued fraction expansion of e/n."
    cost: 100
  - content: "Implement convergents of the continued fraction of e/n. Check each candidate d."
    cost: 125
state: hidden
version: "0.1"
