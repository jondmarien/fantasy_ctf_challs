    content: "FantasyCTF{th3_scrib3s_r0tation_b3tray3d_h1m}"
    case_sensitive: false
files:
  - challenge/encoded.txt
  - challenge/encrypt.py
hints:
  - content: "Two common encodings, applied one after the other. The outer one is very common on the web."
    cost: 0
  - content: "The outer encoding uses an alphabet of 64 characters. The inner one rotates each letter by 13."
    cost: 15
next: "The Goblin Messenger's Cipher"
tags:
