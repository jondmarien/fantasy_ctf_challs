name: "The Scribe's Encoded Scroll"
author: "Jon Marien"
category: crypto
description: |
  A dusty scroll was recovered from the ruins of the Arcane Library. The scribe who wrote it was known for his love of obfuscation — layering one encoding atop another to hide his secrets.

  The scroll's contents have been intercepted. Decode them to reveal the hidden message.
value: 100
type: dynamic
extra:
  initial: 100
  minimum: 30
  decay: 30
solution: solution/SOLUTION.md

